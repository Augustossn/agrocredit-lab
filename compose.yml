name: agrocredit-lab
services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: agrolab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD local em .env}
      POSTGRES_DB: agrocredit
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrolab -d agrocredit"]
      interval: 3s
      timeout: 3s
      retries: 20
  moto:
    image: motoserver/moto:5.2.1
    environment: {MOTO_PORT: "5000"}
    ports: ["127.0.0.1:5000:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')"]
      interval: 3s
      timeout: 3s
      retries: 20
  elasticmq:
    image: softwaremill/elasticmq:1.7.0
    ports: ["127.0.0.1:9324:9324"]
    volumes: ["./config/elasticmq.conf:/opt/elasticmq.conf:ro"]
    # SQS é verificado pela API em /api/health. Sem dependência de curl na imagem.
volumes:
  pg-data:
